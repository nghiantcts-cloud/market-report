name: Daily market report

on:
  schedule:
    # 23:30 UTC = 06:30 giờ Việt Nam. GitHub thường chạy trễ 10-30 phút nên báo cáo sẽ đến khoảng 7h.
    - cron: "30 23 * * *"
  workflow_dispatch:   # cho phép bấm "Run workflow" thủ công (dùng được cả trên Safari iPhone)

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tạo và gửi báo cáo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Xoá dòng dưới nếu repo ở chế độ private (GitHub Pages miễn phí cần repo public)
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python market_report.py --site

      - name: Lưu lịch sử và trang web
        if: always()
        run: |
          git config user.name "market-report-bot"
          git config user.email "market-report-bot@users.noreply.github.com"
          git add docs history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Báo cáo $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git pull --rebase
            git push
          fi
